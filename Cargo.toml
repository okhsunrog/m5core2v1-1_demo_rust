[package]
edition      = "2024"
name         = "m5core2v1-1_esp-hal_demo"
rust-version = "1.92"
version      = "0.1.0"

[[bin]]
name = "m5core2v1-1_esp-hal_demo"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
heapless         = "0.9"

# PMIC (AXP2101) driver
axp2101-dd = { version = "0.2.3", features = ["log"] }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embassy-embedded-hal = "0.6"
embassy-sync = "0.8"
ft6336u-dd = { version = "0.1.0", features = ["log"] }
slint = { git = "https://github.com/slint-ui/slint", branch = "master", default-features = false, features = ["unsafe-single-threaded", "libm", "renderer-software", "compat-1-2"] }
ina3221-dd = { version = "0.1.0", features = ["log"] }
pcf8563-dd = { version = "0.3.0", features = ["log"] }

# BLE
esp-radio = { version = "0.18.0", features = [
  "ble",
  "esp-alloc",
  "esp32",
  "log-04",
  "unstable",
] }
bt-hci = "0.8.1"
embassy-futures = "0.1"
bytemuck = "1.25.0"
mipidsi = "0.10.0"
trouble-host = { git = "https://github.com/embassy-rs/trouble", version = "0.6.0", features = ["derive"] }
esp-storage = { version = "0.9.0", features = ["esp32"] }
sequential-storage = { version = "7.2.0", features = ["postcard"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
audio-codec-algorithms = "0.8.0"
esp32 = { version = "0.40.2", features = ["critical-section"] }


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

# esp-storage requires opt-level >= 2 for ESP32, even in dev builds.
[profile.dev.package.esp-storage]
opt-level = 3

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

# esp-storage requires opt-level >= 2 for ESP32 (timing-sensitive flash ops).
[profile.release.package.esp-storage]
opt-level = 3

# xtensa-lx-rt inline asm hits LLVM bug with opt-level=s (only needed when using local esp-hal)
[profile.dev.package.xtensa-lx-rt]
opt-level = 0

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", branch = "master" }

# esp-hal fork: #5603 (DmaBuffer I2S API) + reset_tx/reset_rx read-back barrier.
# Temporary until both PRs (#5603, #5609) land — then drop this whole block and
# use crates.io. All monorepo crates must be patched together (shared internal APIs).
[patch.crates-io]
esp-hal                  = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-hal-procmacros       = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-alloc                = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-backtrace            = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-bootloader-esp-idf   = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-config               = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-metadata-generated   = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-phy                  = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-println              = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-radio                = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-radio-rtos-driver    = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-rom-sys              = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-rtos                 = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-storage              = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
esp-sync                 = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
xtensa-lx                = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
xtensa-lx-rt             = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
xtensa-lx-rt-proc-macros = { git = "https://github.com/okhsunrog/esp-hal", branch = "i2s-dma-reset-fix" }
