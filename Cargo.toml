[package]
edition      = "2024"
name         = "m5core2v1-1_esp-hal_demo"
rust-version = "1.92"
version      = "0.1.0"

[[bin]]
name = "m5core2v1-1_esp-hal_demo"
path = "./src/bin/main.rs"

# ESP32 I2S reset_tx regression repro (serial, no JTAG). Point the local
# esp-hal patch below at a broken (#5603) vs fixed (reset_tx barrier) branch
# and run: cargo run --release --bin i2s_loopback
[[bin]]
name = "i2s_loopback"
path = "./src/bin/i2s_loopback.rs"

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
heapless         = "0.9"

# PMIC (AXP2101) driver
axp2101-dd = { version = "0.2.3", features = ["log"] }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embassy-embedded-hal = "0.6"
embassy-sync = "0.8"
ft6336u-dd = { version = "0.1.0", features = ["log"] }
slint = { git = "https://github.com/okhsunrog/slint", branch = "rgb565-be", default-features = false, features = ["unsafe-single-threaded", "libm", "renderer-software", "compat-1-2"] }
ina3221-dd = { version = "0.1.0", features = ["log"] }
pcf8563-dd = { version = "0.3.0", features = ["log"] }

# BLE
esp-radio = { version = "0.18.0", features = [
  "ble",
  "esp-alloc",
  "esp32",
  "log-04",
  "unstable",
] }
bt-hci = "0.8.1"
embassy-futures = "0.1"
bytemuck = "1.25.0"
mipidsi = "0.10.0"
trouble-host = { git = "https://github.com/embassy-rs/trouble", version = "0.6.0", features = ["derive"] }
esp-storage = { version = "0.9.0", features = ["esp32"] }
sequential-storage = { version = "7.2.0", features = ["postcard"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
audio-codec-algorithms = "0.8.0"
esp32 = { version = "0.40.2", features = ["critical-section"] }
sea-codec = { version = "0.7.0", default-features = false }
lc3-codec = "0.2.0"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

# esp-storage requires opt-level >= 2 for ESP32, even in dev builds.
[profile.dev.package.esp-storage]
opt-level = 3

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

# esp-storage requires opt-level >= 2 for ESP32 (timing-sensitive flash ops).
[profile.release.package.esp-storage]
opt-level = 3

# xtensa-lx-rt inline asm hits LLVM bug with opt-level=s (only needed when using local esp-hal)
[profile.dev.package.xtensa-lx-rt]
opt-level = 0

[build-dependencies]
slint-build = { git = "https://github.com/okhsunrog/slint", branch = "rgb565-be" }

# LOCAL DEV ONLY (branch local-esp-hal-test): patch esp-hal to the local clone
# at ~/code/rust/esp-hal so changes there rebuild instantly. main uses the git
# fork branch instead. Keep the local clone on the i2s-dma-reset-fix branch.
# All monorepo crates must be patched together (shared internal APIs).
[patch.crates-io]
# Bench-only vendored patches (needed by src/bin/bench_codecs.rs):
# - radium 0.7.0 (via bitvec → lc3-codec) assumes 64-bit atomics; Xtensa has
#   none. Local copy adds an "xtensa" arm to its build.rs.
# - sea-codec declares cdylib/staticlib crate-types that need a panic handler +
#   allocator (fatal on no_std). Local copy is rlib-only.
radium                   = { path = "vendor/radium" }
sea-codec                = { path = "vendor/sea-codec" }
esp-hal                  = { path = "/home/okhsunrog/code/rust/esp-hal/esp-hal" }
esp-hal-procmacros       = { path = "/home/okhsunrog/code/rust/esp-hal/esp-hal-procmacros" }
esp-alloc                = { path = "/home/okhsunrog/code/rust/esp-hal/esp-alloc" }
esp-backtrace            = { path = "/home/okhsunrog/code/rust/esp-hal/esp-backtrace" }
esp-bootloader-esp-idf   = { path = "/home/okhsunrog/code/rust/esp-hal/esp-bootloader-esp-idf" }
esp-config               = { path = "/home/okhsunrog/code/rust/esp-hal/esp-config" }
esp-metadata-generated   = { path = "/home/okhsunrog/code/rust/esp-hal/esp-metadata-generated" }
esp-phy                  = { path = "/home/okhsunrog/code/rust/esp-hal/esp-phy" }
esp-println              = { path = "/home/okhsunrog/code/rust/esp-hal/esp-println" }
esp-radio                = { path = "/home/okhsunrog/code/rust/esp-hal/esp-radio" }
esp-radio-rtos-driver    = { path = "/home/okhsunrog/code/rust/esp-hal/esp-radio-rtos-driver" }
esp-rom-sys              = { path = "/home/okhsunrog/code/rust/esp-hal/esp-rom-sys" }
esp-rtos                 = { path = "/home/okhsunrog/code/rust/esp-hal/esp-rtos" }
esp-storage              = { path = "/home/okhsunrog/code/rust/esp-hal/esp-storage" }
esp-sync                 = { path = "/home/okhsunrog/code/rust/esp-hal/esp-sync" }
xtensa-lx                = { path = "/home/okhsunrog/code/rust/esp-hal/xtensa-lx" }
xtensa-lx-rt             = { path = "/home/okhsunrog/code/rust/esp-hal/xtensa-lx-rt" }
xtensa-lx-rt-proc-macros = { path = "/home/okhsunrog/code/rust/esp-hal/xtensa-lx-rt-proc-macros" }
